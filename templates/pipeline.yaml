AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Release pipeline. An EventBridge rule watches Amazon ECR for a new image push
  and starts CodePipeline, which hands taskdef.json and appspec.yaml from the
  application repository to CodeDeploy for a blue/green deployment onto ECS.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  # The container name is deliberately absent. CodeDeploy reads it from
  # appspec.yaml in the application repository, and the pipeline's
  # Image1ContainerName is the <IMAGE1_NAME> placeholder, not the container.
  # Declaring it here would be a second source of truth that nothing reads.
  ConnectionArn:
    Type: String
    Description: >-
      CodeConnections connection to GitHub. Created by the bootstrap stack and
      resolved from SSM by the root stack, which passes the ARN down here.
  EcrRepositoryName:
    Type: String
    Description: Handed down by the root stack from the ECR stack's output.
  AppRepositoryId:
    Type: String
    Description: >-
      owner/repo of the application repository. Deliberately has no default: a
      stale placeholder here builds a pipeline that runs happily against the
      wrong source, which is far harder to spot than a stack that refuses to
      deploy.
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$
  AppBranch:
    Type: String
    Default: main
  TriggerImageTag:
    Type: String
    Default: latest
    Description: >-
      Only a push of this tag starts a deployment. The build workflow pushes the
      commit SHA first and this tag last, so the image is complete by the time
      the pipeline reacts.
  TaskDefinitionPath:
    Type: String
    Default: taskdef.json
  AppSpecPath:
    Type: String
    Default: appspec.yaml
  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSAllAtOnce
    AllowedValues:
      - CodeDeployDefault.ECSAllAtOnce
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery3Minutes
      - CodeDeployDefault.ECSCanary10Percent5Minutes
  TerminationWaitMinutes:
    Type: Number
    Default: 5
    Description: How long the blue task set is kept after a successful cutover.

Resources:
  # -------------------------------------------------------- Artifact storage
  # CodePipeline's own bucket: the source artifact (appspec.yaml and
  # taskdef.json from the application repository) and the ECR
  # imageDetail.json land here. Deliberately separate from the bucket that
  # holds packaged CloudFormation templates - different lifecycle, different
  # readers, and release state should not share storage with build plumbing.
  ArtifactBucket:
    Type: AWS::S3::Bucket
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-pipeline-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub '${ArtifactBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  # ------------------------------------------------------------- CodeDeploy
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codedeploy'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codedeploy.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AWSCodeDeployRoleForECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: !Sub '${ProjectName}-${Environment}'
      ComputePlatform: ECS
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: !Sub '${ProjectName}-${Environment}-dg'
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          ActionOnTimeout: CONTINUE_DEPLOYMENT
        TerminateBlueInstancesOnDeploymentSuccess:
          Action: TERMINATE
          TerminationWaitTimeInMinutes: !Ref TerminationWaitMinutes
      ECSServices:
        - ClusterName:
            Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ClusterName'
          ServiceName:
            Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ServiceName'
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns:
                - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-ProductionListenerArn'
            TestTrafficRoute:
              ListenerArns:
                - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-TestListenerArn'
            TargetGroups:
              - Name:
                  Fn::ImportValue: !Sub '${ProjectName}-${Environment}-BlueTargetGroupName'
              - Name:
                  Fn::ImportValue: !Sub '${ProjectName}-${Environment}-GreenTargetGroupName'
      AutoRollbackConfiguration:
        Enabled: true
        Events:
          - DEPLOYMENT_FAILURE
          - DEPLOYMENT_STOP_ON_ALARM
      AlarmConfiguration:
        Enabled: true
        IgnorePollAlarmFailure: false
        Alarms:
          - Name:
              Fn::ImportValue: !Sub '${ProjectName}-${Environment}-Alb5xxAlarmName'
          - Name:
              Fn::ImportValue: !Sub '${ProjectName}-${Environment}-UnhealthyHostAlarmName'

  # ----------------------------------------------------------- CodePipeline
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-codepipeline'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: artifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:GetBucketVersioning
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub '${ArtifactBucket.Arn}/*'
        - PolicyName: source
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Effect: Allow
                Action:
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchCheckLayerAvailability
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}'
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:RegisterApplicationRevision
                  - codedeploy:ContinueDeployment
                Resource:
                  - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}'
                  - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${ProjectName}-${Environment}-dg'
                  - !Sub 'arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*'
              - Effect: Allow
                Action:
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                Resource: '*'
              # taskdef.json carries a `tags` block, and RegisterTaskDefinition
              # with tags is authorised as a separate ecs:TagResource action on
              # the family. Without it the deploy stage fails with
              # "not authorized to perform: ecs:TagResource".
              - Effect: Allow
                Action: ecs:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/${ProjectName}-${Environment}:*'
              # CodeDeployToECS registers the revision from taskdef.json, so the
              # pipeline must be allowed to pass the two task roles it names.
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-task-execution'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-${Environment}-task'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub '${ProjectName}-${Environment}'
      PipelineType: V2
      ExecutionMode: QUEUED
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            # Deployment descriptors (taskdef.json / appspec.yaml) live beside the
            # application code and are consumed verbatim - nothing is templated
            # or regenerated here.
            - Name: AppRepository
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Ref AppRepositoryId
                BranchName: !Ref AppBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: false
              OutputArtifacts:
                - Name: SourceArtifact
            - Name: ContainerImage
              RunOrder: 1
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: ECR
                Version: '1'
              Configuration:
                RepositoryName: !Ref EcrRepositoryName
                ImageTag: !Ref TriggerImageTag
              OutputArtifacts:
                - Name: ImageArtifact
        - Name: Deploy
          Actions:
            - Name: BlueGreenToEcs
              RunOrder: 1
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: '1'
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: SourceArtifact
                TaskDefinitionTemplatePath: !Ref TaskDefinitionPath
                AppSpecTemplateArtifact: SourceArtifact
                AppSpecTemplatePath: !Ref AppSpecPath
                Image1ArtifactName: ImageArtifact
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: SourceArtifact
                - Name: ImageArtifact
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ------------------------------------------------- EventBridge ECR trigger
  PipelineTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-ecr-trigger'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-pipeline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'

  EcrImagePushRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-ecr-image-push'
      Description: Starts the release pipeline when a new application image is pushed.
      State: ENABLED
      EventPattern:
        source:
          - aws.ecr
        detail-type:
          - ECR Image Action
        detail:
          action-type:
            - PUSH
          result:
            - SUCCESS
          repository-name:
            - !Ref EcrRepositoryName
          image-tag:
            - !Ref TriggerImageTag
      Targets:
        - Id: release-pipeline
          Arn: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}'
          RoleArn: !GetAtt PipelineTriggerRole.Arn

Outputs:
  PipelineName:
    Value: !Ref Pipeline
    Export:
      Name: !Sub '${ProjectName}-${Environment}-PipelineName'
  CodeDeployApplicationName:
    Value: !Ref CodeDeployApplication
    Export:
      Name: !Sub '${ProjectName}-${Environment}-CodeDeployApplicationName'
  DeploymentGroupName:
    Value: !Ref DeploymentGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DeploymentGroupName'
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
