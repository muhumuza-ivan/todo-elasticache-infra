AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Per-tier security groups and the interface VPC endpoints the private tiers need.
  Reachability is controlled with ingress rules only. Security groups are stateful,
  so a reply never needs a matching egress rule, and the private subnets carry no
  default route, so egress is already bounded by routing to the VPC, the interface
  endpoints and the S3 gateway endpoint. Each group therefore leaves egress at the
  default and names exactly who may open a connection to it.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application container listens on.
  TestListenerPort:
    Type: Number
    Default: 8080
    Description: ALB listener port CodeDeploy uses to expose the green task set.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the public ALB on port 80.
  TestListenerCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: >-
      CIDR allowed to reach the blue/green test listener. Defaults to the VPC CIDR
      so pre-cutover validation is internal only; widen deliberately if you need to
      curl the green task set from outside.

Resources:
  # GroupDescription is IMMUTABLE: EC2 cannot change a security group's
  # description, so CloudFormation replaces the group. GroupName is fixed here
  # and these group IDs are exported to AppStack, DataStack and CacheStack, so
  # a replacement both collides with the live group and cannot update an in-use
  # export. Editing any description below therefore means rebuilding the whole
  # environment, not a rolling update. Change the wording only with that cost
  # accepted.
  #
  # Egress is deliberately unset: a security group created without
  # SecurityGroupEgress keeps EC2's default allow-all rule, so the tiers can
  # still open the connections they need. Adding a standalone
  # AWS::EC2::SecurityGroupEgress resource would strip that default.
  # ----------------------------------------------------------------- ALB tier
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-alb-sg'
      GroupDescription: Public ALB - accepts internet HTTP and the blue/green test listener.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
        - Description: Blue/green test listener
          IpProtocol: tcp
          FromPort: !Ref TestListenerPort
          ToPort: !Ref TestListenerPort
          CidrIp: !Ref TestListenerCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb-sg'
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------- ECS tasks tier
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-ecs-sg'
      GroupDescription: Fargate tasks - ingress from the ALB only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-ecs-sg'
        - Key: Tier
          Value: ecs
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # --------------------------------------------------------- RDS Proxy tier
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-rdsproxy-sg'
      GroupDescription: RDS Proxy - ingress from ECS tasks only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rdsproxy-sg'
        - Key: Tier
          Value: rds-proxy
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # --------------------------------------------------------------- RDS tier
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-rds-sg'
      GroupDescription: PostgreSQL - ingress from RDS Proxy only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rds-sg'
        - Key: Tier
          Value: rds
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ------------------------------------------------------- ElastiCache tier
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-cache-sg'
      GroupDescription: ElastiCache for Redis - ingress from ECS tasks only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cache-sg'
        - Key: Tier
          Value: cache
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ------------------------------------------------------- VPC endpoint tier
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-vpce-sg'
      GroupDescription: Interface VPC endpoints - HTTPS from ECS tasks only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpce-sg'
        - Key: Tier
          Value: endpoints
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------- SG rules
  # Declared as standalone resources so groups can reference each other without
  # a circular dependency. Ingress only - see the template description.
  EcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: Application traffic and health checks from the ALB
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  ProxyIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      Description: PostgreSQL from Fargate tasks
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  RdsIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      Description: PostgreSQL from RDS Proxy
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ProxySecurityGroup

  CacheIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      Description: Redis from Fargate tasks
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  VpcEndpointIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      Description: HTTPS from Fargate tasks
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  # ------------------------------------------------------ Interface endpoints
  # Placed in the ECS subnets: they are the only tier that calls AWS APIs.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # Required only by ECS Exec (aws ecs execute-command), which the service enables
  # for live troubleshooting of private tasks.
  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbSecurityGroupId'
  EcsSecurityGroupId:
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcsSecurityGroupId'
  ProxySecurityGroupId:
    Value: !Ref ProxySecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ProxySecurityGroupId'
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecurityGroupId'
  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-CacheSecurityGroupId'
  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-VpcEndpointSecurityGroupId'
