AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Per-tier security groups and the interface VPC endpoints the private tiers need.
  Every security group declares its egress explicitly; tiers that must not initiate
  any outbound connection are pinned to 127.0.0.1/32, which is the CloudFormation
  idiom for "no egress" (omitting SecurityGroupEgress would silently create an
  allow-all 0.0.0.0/0 rule).

Parameters:
  ProjectName:
    Type: String
    Default: todo-app
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ContainerPort:
    Type: Number
    Default: 8080
    Description: Port the application container listens on.
  TestListenerPort:
    Type: Number
    Default: 8080
    Description: ALB listener port CodeDeploy uses to expose the green task set.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: CIDR allowed to reach the public ALB on port 80.
  TestListenerCidr:
    Type: String
    Default: 10.20.0.0/16
    Description: >-
      CIDR allowed to reach the blue/green test listener. Defaults to the VPC CIDR
      so pre-cutover validation is internal only; widen deliberately if you need to
      curl the green task set from outside.
  S3PrefixListId:
    Type: String
    Description: >-
      AWS-managed prefix list ID for S3 in this Region, used for the ECS egress rule
      that reaches ECR image layers through the S3 gateway endpoint. Find it with:
      aws ec2 describe-managed-prefix-lists --region <region>
      --filters Name=prefix-list-name,Values=com.amazonaws.<region>.s3
    AllowedPattern: ^pl-[0-9a-f]+$

Resources:
  # ----------------------------------------------------------------- ALB tier
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-alb-sg'
      GroupDescription: Public ALB - accepts internet HTTP, talks only to ECS tasks.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
        - Description: Blue/green test listener
          IpProtocol: tcp
          FromPort: !Ref TestListenerPort
          ToPort: !Ref TestListenerPort
          CidrIp: !Ref TestListenerCidr
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-alb-sg'
        - Key: Tier
          Value: public
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ----------------------------------------------------------- ECS tasks tier
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-ecs-sg'
      GroupDescription: Fargate tasks - ingress from ALB only, egress to data tiers and VPC endpoints.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-ecs-sg'
        - Key: Tier
          Value: ecs
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # --------------------------------------------------------- RDS Proxy tier
  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-rdsproxy-sg'
      GroupDescription: RDS Proxy - ingress from ECS tasks, egress to the database only.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rdsproxy-sg'
        - Key: Tier
          Value: rds-proxy
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # --------------------------------------------------------------- RDS tier
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-rds-sg'
      GroupDescription: PostgreSQL - ingress from RDS Proxy only, no egress.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupEgress:
        - Description: No outbound connections required
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-rds-sg'
        - Key: Tier
          Value: rds
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ------------------------------------------------------- ElastiCache tier
  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-cache-sg'
      GroupDescription: ElastiCache for Redis - ingress from ECS tasks only, no egress.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupEgress:
        - Description: No outbound connections required
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cache-sg'
        - Key: Tier
          Value: cache
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ------------------------------------------------------- VPC endpoint tier
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${ProjectName}-${Environment}-vpce-sg'
      GroupDescription: Interface VPC endpoints - HTTPS from ECS tasks only, no egress.
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      SecurityGroupEgress:
        - Description: No outbound connections required
          IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-vpce-sg'
        - Key: Tier
          Value: endpoints
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # ---------------------------------------------------------------- SG rules
  # Declared as standalone resources so groups can reference each other without
  # a circular dependency.
  AlbEgressToEcs:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Forward requests and health checks to Fargate tasks
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      DestinationSecurityGroupId: !Ref EcsSecurityGroup

  EcsIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: Application traffic and health checks from the ALB
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  EcsEgressToProxy:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: PostgreSQL through RDS Proxy
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref ProxySecurityGroup

  EcsEgressToCache:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: Redis
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      DestinationSecurityGroupId: !Ref CacheSecurityGroup

  EcsEgressToVpcEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: HTTPS to ECR, CloudWatch Logs, SSM and Secrets Manager endpoints
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup

  EcsEgressToS3:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EcsSecurityGroup
      Description: HTTPS to S3 (ECR image layers) via the gateway endpoint
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationPrefixListId: !Ref S3PrefixListId

  ProxyIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      Description: PostgreSQL from Fargate tasks
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  ProxyEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      Description: PostgreSQL to the RDS instance
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroup

  RdsIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      Description: PostgreSQL from RDS Proxy
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ProxySecurityGroup

  CacheIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      Description: Redis from Fargate tasks
      IpProtocol: tcp
      FromPort: 6379
      ToPort: 6379
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  VpcEndpointIngressFromEcs:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      Description: HTTPS from Fargate tasks
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EcsSecurityGroup

  # ------------------------------------------------------ Interface endpoints
  # Placed in the ECS subnets: they are the only tier that calls AWS APIs.
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  # Required only by ECS Exec (aws ecs execute-command), which the service enables
  # for live troubleshooting of private tasks.
  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId:
        Fn::ImportValue: !Sub '${ProjectName}-${Environment}-VpcId'
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssmmessages'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        Fn::Split:
          - ','
          - Fn::ImportValue: !Sub '${ProjectName}-${Environment}-EcsSubnets'
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

Outputs:
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-AlbSecurityGroupId'
  EcsSecurityGroupId:
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-EcsSecurityGroupId'
  ProxySecurityGroupId:
    Value: !Ref ProxySecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-ProxySecurityGroupId'
  RdsSecurityGroupId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-RdsSecurityGroupId'
  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-CacheSecurityGroupId'
  VpcEndpointSecurityGroupId:
    Value: !Ref VpcEndpointSecurityGroup
    Export:
      Name: !Sub '${ProjectName}-${Environment}-VpcEndpointSecurityGroupId'
