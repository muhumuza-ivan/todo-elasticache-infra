AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Storage for packaged CloudFormation child templates, and nothing else.

  This is the only stack deployed outside main.yaml, and the only one that
  has to be.

  `aws cloudformation package` uploads main.yaml's child templates into this
  bucket, so the bucket must exist before packaging runs - it cannot be a
  nested stack of the template whose children it stores. The deploy workflow
  creates it with a plain `aws cloudformation deploy` as its first step, so
  nothing here is manual.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  ExpireAfterDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Packaged templates are content-addressed, so superseded copies just accumulate.

Resources:
  TemplateBucket:
    Type: AWS::S3::Bucket
    # Retain so ownership can be handed to the bootstrap stack by deleting this
    # stack and importing the bucket, rather than destroying and recreating a
    # globally unique name.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-cfn-templates-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-superseded-templates
            Status: Enabled
            ExpirationInDays: !Ref ExpireAfterDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cfn-templates'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: cicd
        - Key: ManagedBy
          Value: cloudformation

  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # Retained too, so the bucket keeps DenyInsecureTransport during the handover
    # instead of sitting unprotected between the delete and the re-create.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt TemplateBucket.Arn
              - !Sub '${TemplateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  BucketName:
    Description: Target for `aws cloudformation package --s3-bucket`. Not the pipeline artifact bucket.
    Value: !Ref TemplateBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-TemplateBucketName'
