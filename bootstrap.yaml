AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  The deploy workflow's prerequisites: the two IAM roles it authenticates with,
  and the S3 bucket it packages main.yaml's child templates into. All three are
  created once and reused by every deploy.

  Created ONCE from the console, because the workflow that maintains it
  authenticates with a role this very stack creates - a workflow cannot issue
  its own credentials. After that it is deployed by
  .github/workflows/bootstrap.yml from the `bootstrap` branch.

  Everything else the project needs is created by main.yaml: ECR, the app OIDC
  role, the CodeConnections connection, network, security, data, cache, app and
  pipeline. The template bucket cannot live there, because `aws cloudformation
  package` uploads main.yaml's own children into it, so it has to exist before
  main.yaml is packaged. It holds only packaged templates; CodePipeline keeps
  appspec.yaml and taskdef.json in a separate artifact bucket in pipeline.yaml.

Parameters:
  ProjectName:
    Type: String
    Default: todo-app
    Description: Prefix used for resource names and cross-stack exports.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]

  GitHubOrg:
    Type: String
    Default: muhumuza-ivan
    Description: Organisation or user that owns the infrastructure repository.
    AllowedPattern: ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$
  GitHubInfraRepo:
    Type: String
    Default: todo-elasticache-infra
    Description: Repository whose workflow deploys this project.
    AllowedPattern: ^[A-Za-z0-9._-]{1,100}$
  GitHubInfraBranch:
    Type: String
    Default: main
    Description: Branch that deploys the environment (main.yaml).
    AllowedPattern: ^[A-Za-z0-9._/-]{1,255}$
  GitHubBootstrapBranch:
    Type: String
    Default: bootstrap
    Description: >-
      Branch that deploys this stack. Kept separate from main so a change to
      the deployment machinery is never mixed into an application deploy, and
      so the blast radius of each branch is obvious.
    AllowedPattern: ^[A-Za-z0-9._/-]{1,255}$
  # No defaults on the two IDs below. They are account and repository specific,
  # so a default would be a number that is silently wrong everywhere except
  # here. The workflow reads both from the GitHub Actions context and passes
  # them in; a console operator is prompted and can fetch them with the
  # commands in each description.
  GitHubOrgId:
    Type: String
    Description: >-
      Numeric owner ID. GitHub issues immutable subject claims that embed the
      owner and repository IDs, so renaming cannot carry access over.
      Get it with: gh api users/<org> --jq .id
    AllowedPattern: ^[0-9]{1,20}$
  GitHubInfraRepoId:
    Type: String
    Description: >-
      Numeric repository ID of the infrastructure repository.
      Get it with: gh api repos/<org>/<repo> --jq .id
    AllowedPattern: ^[0-9]{1,20}$

  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::765812221756:oidc-provider/token.actions.githubusercontent.com
    Description: >-
      Existing GitHub OIDC provider. An account holds at most one per issuer
      URL, and this one already exists, so no stack in this project creates it.

  TemplateExpireAfterDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Packaged templates are content-addressed, so superseded copies just accumulate.
  ManagedResourcePrefix:
    Type: String
    Default: todo-app-
    Description: >-
      IAM role names the stack role is allowed to touch. Every stack in this
      project is named todo-app-dev-*, and CloudFormation derives auto-generated
      role names from the stack name, so this prefix covers them all without
      granting account-wide IAM.
    AllowedPattern: ^[A-Za-z0-9+=,.@_-]{1,48}$

Resources:
  # ------------------------------------------------------------- Deploy role
  # Assumed by the infrastructure repository workflow through GitHub OIDC. It
  # can drive CloudFormation and upload templates, but it cannot create
  # application resources itself - it hands StackRole to CloudFormation for
  # that. No long-lived keys exist anywhere.
  GitHubActionsDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-gha-deploy'
      Description: Assumed by GitHub Actions to deploy the CloudFormation root stack.
      # A full root-stack create runs ~45 min and the deploy workflow holds
      # one session for the whole wait. At 3600 the credentials expired 14
      # seconds after the CLI's 60-minute waiter gave up, so the job could
      # never outlast either ceiling.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            # Two branches of one repository, and nothing else: main deploys
            # the environment, bootstrap deploys this stack. A run on any other
            # branch, or in any other repository, cannot assume this role.
            #
            # Both subject formats are listed. GitHub issues an IMMUTABLE
            # subject that embeds the owner and repository IDs
            # (repo:<org>@<ownerId>/<repo>@<repoId>:ref:...) when
            # use_immutable_subject is on, which it is for these repositories;
            # the plain form is kept so the role still works if that is ever
            # turned off. Check which one you get with:
            #   gh api repos/<org>/<repo>/actions/oidc/customization/sub
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${GitHubInfraRepo}@${GitHubInfraRepoId}:ref:refs/heads/${GitHubInfraBranch}'
                  - !Sub 'repo:${GitHubOrg}@${GitHubOrgId}/${GitHubInfraRepo}@${GitHubInfraRepoId}:ref:refs/heads/${GitHubBootstrapBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubInfraRepo}:ref:refs/heads/${GitHubInfraBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubInfraRepo}:ref:refs/heads/${GitHubBootstrapBranch}'
      Policies:
        - PolicyName: drive-cloudformation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DeployStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListChangeSets
                  - cloudformation:ListStacks
                  - cloudformation:ListStackResources
                  - cloudformation:ValidateTemplate
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource: '*'
        # The CloudFormation template bucket lives in its own stack, which
        # this role creates as the first step of the deploy workflow and then
        # packages into. It is NOT the pipeline artifact bucket - pipeline.yaml
        # owns that one. Referenced by name rather than GetAtt, because it is
        # no longer a resource of this template.
        - PolicyName: template-bucket
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageTheBucketItself
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:DeleteBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:DeleteBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketOwnershipControls
                  - s3:GetBucketOwnershipControls
                  - s3:PutLifecycleConfiguration
                  - s3:GetLifecycleConfiguration
                  - s3:PutBucketTagging
                  - s3:GetBucketTagging
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-cfn-templates-${AWS::AccountId}-${AWS::Region}'
              - Sid: PackageTemplatesIntoIt
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${Environment}-cfn-templates-${AWS::AccountId}-${AWS::Region}/*'
        - PolicyName: pass-stack-role
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The workflow hands this role to CloudFormation and nothing else,
              # so a compromised workflow cannot borrow its permissions directly.
              - Sid: PassStackRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt StackRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-gha-deploy'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: cicd
        - Key: ManagedBy
          Value: cloudformation

  # --------------------------------------------------------------- Stack role
  # CloudFormation assumes this to create the actual resources. There is no
  # interactive caller behind a workflow deployment, so this role is the only
  # thing standing between a commit and the account.
  #
  # Service-level wildcards are deliberate for the infrastructure services this
  # project owns: a missing action surfaces as a stack rollback half way through
  # a 20 minute RDS create, which is a far worse failure mode than a broad grant
  # in a single-purpose lab account. IAM is the exception - it is the one
  # privilege that could be used to escape this role, so it is pinned to the
  # name prefix this project uses and to service-linked roles.
  StackRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-cfn-exec'
      Description: Assumed by CloudFormation to create the resources in this project.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: project-services
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InfrastructureServices
                Effect: Allow
                Action:
                  - ec2:*
                  - rds:*
                  - elasticache:*
                  - ecs:*
                  - ecr:*
                  - elasticloadbalancing:*
                  - application-autoscaling:*
                  - logs:*
                  - cloudwatch:*
                  - events:*
                  - ssm:*
                  - secretsmanager:*
                  - kms:*
                  - s3:*
                  - codedeploy:*
                  - codepipeline:*
                  - codestar-connections:*
                  - codeconnections:*
                  - cloudformation:*
                  - tag:*
                Resource: '*'

              # Roles this project defines: task role, task execution role,
              # pipeline role, CodeDeploy role, EventBridge trigger role and the
              # GitHub Actions push role. All are named, or auto-named, from a
              # todo-app-* stack.
              - Sid: ProjectScopedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                  - iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ManagedResourcePrefix}*'

              # ECS, RDS, ElastiCache and Application Auto Scaling each create a
              # service-linked role on first use in a fresh account.
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/*'

              # The app OIDC stack reads the GitHub identity provider.
              - Sid: GitHubOidcProvider
                Effect: Allow
                Action:
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:ListOpenIDConnectProviders
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                  - iam:AddClientIDToOpenIDConnectProvider
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cfn-exec'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: cicd
        - Key: ManagedBy
          Value: cloudformation

  # Packaging target for main.yaml's child templates. It lives here rather than
  # in a stack of its own because it is created once and reused by every deploy,
  # exactly like the two roles above. It cannot live in main.yaml, because
  # 'aws cloudformation package' uploads main.yaml's own children into it.
  TemplateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-cfn-templates-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-superseded-templates
            Status: Enabled
            ExpirationInDays: !Ref TemplateExpireAfterDays
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-${Environment}-cfn-templates'
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: Component
          Value: cicd
        - Key: ManagedBy
          Value: cloudformation

  TemplateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    # Retained alongside the bucket: a retained bucket without this policy would
    # be a bucket that no longer refuses plaintext transport.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref TemplateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt TemplateBucket.Arn
              - !Sub '${TemplateBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:
  DeployRoleArn:
    Description: Value for the AWS_DEPLOY_ROLE_ARN repository secret.
    Value: !GetAtt GitHubActionsDeployRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-DeployRoleArn'
  StackRoleArn:
    Description: Value for the AWS_STACK_ROLE_ARN repository secret; passed to CloudFormation as --role-arn.
    Value: !GetAtt StackRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-StackRoleArn'
  TemplateBucketName:
    Description: Target for 'aws cloudformation package --s3-bucket' in deploy.yml.
    Value: !Ref TemplateBucket
    Export:
      Name: !Sub '${ProjectName}-${Environment}-TemplateBucketName'
