name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'main.yaml'
      - 'templates/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Two deploys must never overlap: CloudFormation rejects the second, and a
# cancelled run mid-update leaves the stack in UPDATE_IN_PROGRESS.
concurrency:
  group: deploy-infrastructure
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # request the OIDC token; no AWS keys are stored

env:
  STACK_NAME: todo-app-dev
  APP_REPO: todo-elasticache-app   # must match GitHubAppRepo in main.yaml

jobs:
  deploy:
    name: Package and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}

      # Holds the packaged child templates only, and cannot be nested inside
      # main.yaml because packaging uploads main.yaml's children into it.
      # CodePipeline's artifact bucket (appspec.yaml, taskdef.json) is separate
      # and lives in pipeline.yaml.
      - name: Deploy the CloudFormation template bucket
        id: bucket
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "${STACK_NAME}-templates" \
            --template-file templates/template-bucket.yaml \
            --no-fail-on-empty-changeset
          name=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}-templates" \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" --output text)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Uploads every child template main.yaml references and rewrites the
          # local paths to S3 URLs. Keys are content-hashed, so an unchanged
          # child resolves to the same object and reports no changes.
          aws cloudformation package \
            --template-file main.yaml \
            --s3-bucket "${{ steps.bucket.outputs.name }}" \
            --s3-prefix "$STACK_NAME" \
            --output-template-file packaged.yaml

          # GitHub issues an immutable OIDC subject that embeds the owner and
          # repository IDs, so renaming cannot carry AWS access over. They are
          # account specific, so they are resolved here and never hardcoded.
          # This workflow runs in the infrastructure repository, so the
          # application repository id has to be looked up.
          app_repo_id=$(gh api "repos/${{ github.repository_owner }}/${APP_REPO}" --jq .id)

          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file packaged.yaml \
            --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --role-arn "${{ secrets.AWS_STACK_ROLE_ARN }}" \
            --no-fail-on-empty-changeset \
            --tags Project=todo-app Environment=dev Component=platform \
                   ManagedBy=github-actions Owner=ivan-muhumuza \
            --parameter-overrides \
              GitHubOrgId=${{ github.repository_owner_id }} \
              GitHubAppRepoId="$app_repo_id"
