name: Deploy bootstrap

# The two IAM roles the deploy workflow authenticates with. Nothing else.
#
# On its own branch so a change to the deployment credentials is never mixed
# into an application deploy.
#
# THE FIRST CREATION CANNOT RUN HERE, and neither can a change to the deploy
# role's own trust policy: this workflow authenticates with that role. Both go
# through the console - see section 2b in DEPLOY-STEPS.md.

on:
  push:
    branches: [bootstrap]
    paths:
      - 'bootstrap.yaml'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

concurrency:
  group: deploy-bootstrap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  STACK_NAME: todo-app-dev-bootstrap

jobs:
  deploy:
    name: Deploy bootstrap stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: gha-bootstrap-${{ github.run_id }}

      - name: Deploy
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file bootstrap.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${{ secrets.AWS_STACK_ROLE_ARN }}" \
            --no-fail-on-empty-changeset \
            --tags Project=todo-app Environment=dev Component=cicd \
                   ManagedBy=github-actions Owner=ivan-muhumuza \
            --parameter-overrides \
              GitHubOrgId=${{ github.repository_owner_id }} \
              GitHubInfraRepoId=${{ github.repository_id }}
